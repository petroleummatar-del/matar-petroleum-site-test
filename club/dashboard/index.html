<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MATAR CONTROL</title><style>body{font:16px Tahoma,Arial;background:#0c1429;color:white;margin:0}main{max-width:820px;margin:auto;padding:20px}section{background:#1c2946;border-radius:16px;padding:22px;margin:15px 0}input,button{font:inherit;padding:13px;border-radius:9px;width:100%;box-sizing:border-box;margin:7px 0}input{background:#0c1429;border:1px solid #7784a8;color:white}button{background:#7555d9;color:white;border:0;font-weight:bold}a{color:#dfd4ff}article{border-top:1px solid #586580;padding:14px 0}small{color:#c5d0e5}</style><main><h1>MATAR CONTROL</h1><p>لوحة المالك — النادي والنقاط والتعبئات</p><section id="login"><h2>دخول المالك</h2><input id="email" type="email" placeholder="البريد الإلكتروني"><input id="password" type="password" placeholder="كلمة السر"><button id="enter">دخول</button></section><div id="private" hidden><section><h2>إدارة MATAR CLUB</h2><p><a href="../owner/">الموافقة على العضويات الجديدة وإرسال واتساب</a></p><p><a href="../staff/">شاشة العامل — تسجيل التعبئات</a></p><p><a href="../">صفحة الزبون والنقاط</a></p></section><section><h2>طلبات التعبئة بانتظار الموافقة</h2><button id="refresh">تحديث الطلبات</button><div id="pending"></div></section><section><h2>ملخص النظام</h2><pre id="summary" style="white-space:pre-wrap;overflow-wrap:anywhere"></pre></section><button id="logout">تسجيل خروج</button></div><section><p id="status" role="status"></p><small>صلاحيات الإدارة محمية داخل قاعدة البيانات.</small></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const sb=supabase.createClient('https://zvxotwnwdkywttdjojpx.supabase.co','sb_publishable__-ImiWyhptaElvhhvon7MQ_vffPtuFV');const $=id=>document.getElementById(id);const msg=t=>$('status').textContent=t;function txt(parent,s){parent.append(document.createTextNode(String(s??'')))}
async function load(){const {data,error}=await sb.rpc('matar_owner_pending_refuels');if(error){msg('صلاحية المالك مطلوبة: '+error.message);return}$('login').hidden=true;$('private').hidden=false;const list=$('pending');list.replaceChildren();if(!data?.length)txt(list,'ما في طلبات تعبئة معلّقة.');for(const r of data||[]){const a=document.createElement('article');const p=document.createElement('p');txt(p,r.customer_name+' — '+r.customer_phone+' — '+r.quantity+' ليتر — '+r.potential_points+' نقطة — فاتورة '+r.reference_code);a.append(p);for(const [title,fn] of [['موافقة','matar_owner_approve_refuel'],['رفض','matar_owner_reject_refuel']]){const b=document.createElement('button');b.textContent=title;b.onclick=async()=>{if(!confirm(title+' على تعبئة '+r.customer_name+'؟'))return;b.disabled=true;const {error:e}=await sb.rpc(fn,{p_approval_id:r.approval_id});if(e){msg(e.message);b.disabled=false}else{msg('تم تنفيذ '+title);await load()}};a.append(b)}list.append(a)}const d=await sb.rpc('matar_owner_dashboard');$('summary').textContent=d.error?'تعذّر تحميل الملخص: '+d.error.message:JSON.stringify(d.data,null,2)}
$('enter').onclick=async()=>{const {error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)return msg('تعذّر تسجيل الدخول');$('password').value='';await load()};$('refresh').onclick=load;$('logout').onclick=async()=>{await sb.auth.signOut();location.reload()};sb.auth.getSession().then(({data})=>{if(data.session)load()});
</script></html>
