<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MATAR CLUB STAFF</title><style>body{font:16px Tahoma,Arial;background:#10182c;color:white;margin:0}main{max-width:650px;margin:auto;padding:20px}section{background:#1c2946;padding:22px;border-radius:18px;margin:15px 0}input,select,button{box-sizing:border-box;width:100%;padding:13px;margin:7px 0 13px;border-radius:10px;font:inherit}input,select{background:#0d1630;color:white;border:1px solid #65749a}button{background:#7957dd;border:0;color:white;font-weight:bold}a{color:#d6c8ff}label{display:block}small{color:#c5d0e5}</style><main><h1>MATAR CLUB — شاشة العامل</h1><p>تسجيل تعبئات الزبائن وإضافة نقاطهم</p><section id="login"><h2>دخول العامل</h2><label>اسم العامل</label><input id="worker" autocomplete="username"><label>رمز العامل PIN</label><input id="pin" type="password" autocomplete="current-password"><button id="enter">دخول</button></section><section id="work" hidden><h2>تسجيل تعبئة</h2><label>رقم الزبون</label><input id="phone" type="tel" placeholder="03 123 456"><button id="find">بحث عن الزبون</button><p id="member"></p><label>المحطة</label><select id="branch"><option value="5bfce506-5ee3-4656-af6b-0ff8695e678c">المحطة الكبيرة</option><option value="3f1333b4-e147-4144-aff4-fe1122d6d4dc">المحطة الصغيرة</option></select><label>نوع المحروقات</label><select id="fuel"><option value="gasoline">بنزين 95 / 98</option><option value="diesel">مازوت</option></select><label>الكمية بالليتر</label><input id="liters" type="number" min=".01" step=".01"><label>رقم الفاتورة (8 أحرف على الأقل)</label><input id="ref" minlength="8"><label>رقم السيارة (اختياري)</label><input id="plate"><button id="submit">تأكيد التعبئة</button><button id="logout" style="background:#394664">خروج</button></section><section><p id="status" role="status"></p><small>النقاط تُحتسب حسب إعدادات النظام. بعض التعبئات تحتاج موافقة المالك قبل إضافتها.</small></section><p><a href="../dashboard/">لوحة المالك</a> · <a href="../">حساب الزبون</a></p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const sb=supabase.createClient('https://zvxotwnwdkywttdjojpx.supabase.co','sb_publishable__-ImiWyhptaElvhhvon7MQ_vffPtuFV');const $=id=>document.getElementById(id);let token=null,member=null;const say=t=>$('status').textContent=t;function phone(s){let n=s.replace(/[^0-9]/g,'');if(n.startsWith('961'))n=n.slice(3);if(n.startsWith('0'))n=n.slice(1);return /^\d{7,8}$/.test(n)?'+961'+n:null}function busy(id,v){$(id).disabled=v}
$('enter').onclick=async()=>{busy('enter',true);try{const {data,error}=await sb.rpc('matar_worker_login',{p_name:$('worker').value.trim(),p_pin:$('pin').value});const w=data?.[0];if(error||!w?.session_token)throw Error('تعذّر الدخول. تأكد من الاسم والرمز.');token=w.session_token;$('pin').value='';$('login').hidden=true;$('work').hidden=false;say('أهلاً '+w.worker_name)}catch(e){say(e.message)}finally{busy('enter',false)}};
$('find').onclick=async()=>{member=null;$('member').textContent='';const p=phone($('phone').value);if(!p)return say('رقم غير صحيح');busy('find',true);try{const {data,error}=await sb.rpc('matar_worker_find_member',{p_session_token:token,p_phone:p});if(error)throw error;member=data?.[0]||null;$('member').textContent=member?member.member_name+' — الرصيد: '+member.points_balance:'الزبون غير موجود أو عضويته غير فعّالة';say(member?'تم العثور على الزبون':'لم يتم العثور على الزبون')}catch(e){say(e.message)}finally{busy('find',false)}};
$('submit').onclick=async()=>{if(!member)return say('ابحث عن الزبون أولاً');const q=Number($('liters').value),ref=$('ref').value.trim();if(!(q>0)||ref.length<8)return say('أدخل الكمية ورقم فاتورة صحيح');if(!confirm('تأكيد تعبئة '+q+' ليتر للزبون '+member.member_name+'؟'))return;busy('submit',true);try{const {data,error}=await sb.rpc('matar_worker_submit_refuel',{p_session_token:token,p_member_id:member.member_id,p_branch_id:$('branch').value,p_service_code:$('fuel').value,p_quantity:q,p_reference_code:ref,p_license_plate:$('plate').value.trim()||null});if(error)throw error;say(data.status==='pending'?'التعبئة بانتظار موافقة المالك. النقاط لم تُضف بعد.':'تم تسجيل التعبئة وإضافة '+data.points_added+' نقطة');$('ref').value='';$('liters').value='';member=null;$('member').textContent=''}catch(e){say('تعذّر تسجيل التعبئة: '+e.message)}finally{busy('submit',false)}};
$('logout').onclick=()=>location.reload();
</script></html>
