<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تسجيل عضوية | MATAR CLUB</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#31245b,#091128 70%);color:#f8faff;font:16px system-ui,Tahoma,Arial,sans-serif}main{max-width:520px;margin:30px auto;padding:20px}.card{background:#12203d;border:1px solid #465783;border-radius:24px;padding:26px}h1{text-align:center}p{color:#c7d2eb;line-height:1.8}label{display:block;margin:16px 0 7px}input{width:100%;padding:14px;background:#08152e;border:1px solid #7889b0;border-radius:12px;color:white;font:inherit;direction:ltr}button{width:100%;border:0;background:linear-gradient(100deg,#9651d4,#5479e6);color:white;font:inherit;font-weight:700;border-radius:12px;padding:16px;margin-top:24px}button:disabled{opacity:.5}a{color:#c8b2ff}#msg{min-height:38px}small{color:#aebdde}</style></head><body><main><h1>MATAR CLUB</h1><div class="card"><h2>تسجيل عضوية جديدة</h2><p>سجّل معلوماتك، وطلبك بيوصل مباشرةً لإدارة مطر. بعد الموافقة فيك تفتح حسابك وتشوف نقاطك.</p><form id="form"><label for="name">الاسم الكامل</label><input id="name" autocomplete="name" required minlength="3" maxlength="100" dir="rtl"><label for="phone">رقم الموبايل اللبناني</label><input id="phone" type="tel" inputmode="tel" autocomplete="tel" required placeholder="03 123 456"><label for="pin">الرمز السري (6 أرقام)</label><input id="pin" type="password" inputmode="numeric" minlength="6" maxlength="6" pattern="[0-9]{6}" required autocomplete="new-password"><label for="confirm">تأكيد الرمز السري</label><input id="confirm" type="password" inputmode="numeric" minlength="6" maxlength="6" pattern="[0-9]{6}" required autocomplete="new-password"><button id="send" type="submit">إرسال طلب العضوية</button></form><p id="msg" role="status"></p><small>ما تعطي رمزك السري لأي موظف. موافقة الإدارة لا تعني التحقق التقني من ملكية رقم الهاتف.</small><p><a href="../">عندي حساب — تسجيل الدخول</a></p></div></main><script>
const endpoint='https://zvxotwnwdkywttdjojpx.supabase.co/functions/v1/matar-customer-signup';
const key='sb_publishable__-ImiWyhptaElvhhvon7MQ_vffPtuFV';
const el=id=>document.getElementById(id);
el('form').addEventListener('submit',async ev=>{ev.preventDefault();const name=el('name').value.trim(),phone=el('phone').value,pin=el('pin').value,confirm=el('confirm').value;if(pin!==confirm){el('msg').textContent='الرمزين السريين مش متطابقين.';return}if(!/^\d{6}$/.test(pin)){el('msg').textContent='الرمز لازم يكون 6 أرقام.';return}el('send').disabled=true;el('msg').textContent='عم نرسل طلبك…';try{const r=await fetch(endpoint,{method:'POST',headers:{'content-type':'application/json','apikey':key,'authorization':'Bearer '+key},body:JSON.stringify({name,phone,password:pin})});const data=await r.json();if(data.ok){el('form').hidden=true;el('msg').textContent='تم إرسال طلب عضويتك! بانتظار موافقة الإدارة. بعد الموافقة فيك تفوت على حسابك من صفحة النادي.';}else if(r.status===429){el('msg').textContent='محاولات كثيرة. جرّب بعدين.';}else{el('msg').textContent='تعذّر التسجيل. تأكد من الرقم أو راجع إدارة المحطة إذا الرقم مسجّل مسبقاً.'}}catch{el('msg').textContent='تعذّر الاتصال. جرّب لاحقاً.'}finally{el('send').disabled=false}});
</script></body></html>
